<style>
:root{--bg:#f4f6f9;--surface:#fff;--surface2:#eef1f5;--text:#1b1f24;--muted:#5f6b7a;--border:#e1e5ea;--accent:#0f5f95;--accent-soft:#e3f0f7;--ok:#1d7f46;--ok-soft:#e2f3e9;--warn:#a86400;--warn-soft:#fcf0da;--bad:#bf3329;--bad-soft:#fbe4e2;--c1:#0c2d5e;--c2:#e07b39;--c3:#0b739b;--c4:#8e5bd1;--c5:#d1495b;--c6:#7a8b99}
@media (prefers-color-scheme:dark){:root{--bg:#111316;--surface:#1a1d22;--surface2:#23272d;--text:#e6e9ee;--muted:#9aa5b1;--border:#2d3239;--accent:#6ea3ff;--accent-soft:#1c2940;--ok:#4cc584;--ok-soft:#163224;--warn:#f0b04a;--warn-soft:#382b13;--bad:#ff7b6e;--bad-soft:#3b1e1b;--c1:#6ea3ff;--c2:#f29a5c;--c3:#4fc1b2;--c4:#b08ae8;--c5:#ef7a8a;--c6:#9aa8b5}}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45}
h1{font-size:22px;margin:0 0 4px}h2{font-size:18px;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 20px}
.muted{color:var(--muted)}.small{font-size:12px}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font:inherit}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font:inherit;font-weight:500;white-space:nowrap}

.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}

table{width:100%;border-collapse:collapse;font-size:13px}

td{padding:8px;border-bottom:1px solid var(--border);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface2)}

 .lp-mban{display:block;margin:0 -16px 28px;padding:26px 16px;background:linear-gradient(150deg,#0c2d5e,#0b5f86);color:#fff;font-family:Montserrat,Inter,sans-serif;font-weight:900;font-size:30px;letter-spacing:-.01em}.lp-mban span{color:#5fc3e8}.lp-flogo{margin-bottom:24px}.lp-flogo .logo-img{height:48px}}
/* menu por setores */
.sec{margin-bottom:4px}

<body>
<div id="app"></div>
<script>
// ================= utilitários =================
const $=s=>document.querySelector(s);
let seed=20261106;function rnd(){seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296}
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const pick=a=>a[Math.floor(rnd()*a.length)];
const T0=new Date();T0.setHours(0,0,0,0);
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const dd=(a,b)=>Math.round((b-a)/864e5);
const fD=d=>d?new Date(d).toLocaleDateString('pt-BR'):'—';
const fDT=d=>new Date(d).toLocaleString('pt-BR');
const BRL=v=>Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const BRL2=v=>Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const N=(v,d=0)=>Number(v).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const P=(v,d=1)=>N(v,d)+'%';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESESL=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DOW=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const compKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const compLabel=k=>{const[y,m]=k.split('-').map(Number);return MESES[m-1]+'/'+y};
const kAdd=(k,n)=>{const[y,m]=k.split('-').map(Number);return compKey(new Date(y,m-1+n,1))};
const dk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pdk=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const FER=['01-01','04-21','05-01','09-07','10-12','11-02','11-15','11-20','12-25'];
const isFer=d=>FER.includes(String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));
const isUtil=d=>d.getDay()!==0&&d.getDay()!==6&&!isFer(d);
function nthUtil(y,m0,n){let c=0;for(let d=new Date(y,m0,1);;d=addD(d,1)){if(isUtil(d)&&++c===n)return d}}
function prevUtil(d){d=new Date(d);while(!isUtil(d))d=addD(d,-1);return d}
const hm=s=>{if(!s)return NaN;const[a,b]=String(s).split(':').map(Number);return a*60+b};
const fm=m=>{if(!m)return '';const s=m<0?'-':'';m=Math.abs(Math.round(m));return s+String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const fmh=m=>N(m/60,1)+'h';

// ================= competência de ponto: dia 21 a dia 20 =================
const CUR=T0.getDate()>=21?compKey(new Date(T0.getFullYear(),T0.getMonth()+1,1)):compKey(T0);
const LAST=kAdd(CUR,-1);
const COMPS=[kAdd(CUR,-3),kAdd(CUR,-2),LAST,CUR];
function periodo(k){const[y,m]=k.split('-').map(Number);return {ini:new Date(y,m-2,21),fim:new Date(y,m-1,20)}}
const perLabel=k=>{const p=periodo(k);return fD(p.ini).slice(0,5)+' a '+fD(p.fim)};
function diasPer(k){const p=periodo(k);const r=[];for(let d=new Date(p.ini);d<=p.fim;d=addD(d,1))r.push(new Date(d));return r}
const compOf=d=>d.getDate()>=21?compKey(new Date(d.getFullYear(),d.getMonth()+1,1)):compKey(d);

// ================= regras da folha de ponto (modelo Avante) =================
// Seg a qui 9h, sex 8h, sábado sem carga (tudo vira HE 50%), domingo e feriado HE 100%.
function carga(d){if(isFer(d)||d.getDay()===0||d.getDay()===6)return 0;return d.getDay()===5?480:540}
const TOL=10; // tolerância diária (CLT art. 58, §1º)

function resumoPer(e,k){const t={carga:0,trab:0,normal:0,atraso:0,falta:0,he50:0,he100:0,aus:0,dias:0,faltas:0,semLanc:0,erros:0,horas:{}};

  ['carga','trab','normal','atraso','falta','he50','he100'].forEach(x=>t[x]+=o[x]);
  if(r&&AUSENCIA.includes(r.oc))t.aus+=o.carga;t.aus+=o.atraso;
  if(r&&r.oc==='N')t.dias++;if(r&&r.oc==='FALTA')t.faltas++;if(!r&&o.carga>0&&e.status!=='Desligado')t.semLanc++;if(o.erro)t.erros++;
  horasObra(r,o).forEach(h=>t.horas[h.obra]=(t.horas[h.obra]||0)+h.min)});return t}
function vaMes(e,ym){const[y,m]=ym.split('-').map(Number);const ini=new Date(y,m-1,1),fim=new Date(y,m,0);
 if(e.admissao>fim)return null;const de=e.admissao>ini?e.admissao:ini;const dias=Math.min(30,dd(de,fim)+1);
 let faltas=0;for(let d=new Date(ini);d<=fim&&d<T0;d=addD(d,1)){const r=getP(d,e.mat);if(r&&r.oc==='FALTA')faltas++}
 const prop=e.va*Math.min(dias,30)/30;const desc=faltas===0?0:faltas===1?prop*.25:faltas===2?prop*.5:prop;return {dias,faltas,base:e.va,prop,desc,receber:prop-desc}}
function custoEmp(e,k){const p=periodo(k);if(e.admissao>p.fim)return null;
 const R=resumoPer(e,k);const vh=e.salario*(1+e.adicional)/220;
 const de=e.admissao>p.ini?e.admissao:p.ini;const ate=p.fim<T0?p.fim:addD(T0,-1);const totDias=dd(p.ini,p.fim)+1;const fr=Math.max(0,Math.min(1,(dd(de,ate)+1)/totDias));
 const base=e.salario*(1+e.adicional)*fr;const he=R.he50/60*vh*1.5+R.he100/60*vh*2;const desc=(R.falta+R.atraso)/60*vh;
 const bruto=Math.max(0,base+he-desc);const prov=bruto*(S.cfg.ferias+S.cfg.decimo)/100;const enc=bruto*(S.cfg.inss+S.cfg.fgts)/100;
 const v=vaMes(e,kAdd(k,0));const va=v?v.receber*fr:0;
 return {base,he,desc,bruto,prov,enc,va,total:bruto+prov+enc+va,R,vh}}
function rateio(k){const res={};OBRAS.forEach(o=>res[o.id]={obra:o.id,colabs:new Set(),horas:0,sal:0,he:0,prov:0,enc:0,va:0,total:0});const linhas=[];let semLanc=0,erros=0;
 EMP.forEach(e=>{const c=custoEmp(e,k);if(!c)return;semLanc+=c.R.semLanc;erros+=c.R.erros;
  let hs=Object.entries(c.R.horas);const ht=hs.reduce((s,h)=>s+h[1],0);const semHoras=!ht;if(semHoras)hs=[[e.obra,1]];const tot=ht||1;
  hs.forEach(([ob,min])=>{const f=min/tot;const r=res[ob];if(!r)return;r.colabs.add(e.mat);r.horas+=semHoras?0:min;r.sal+=(c.base-c.desc)*f;r.he+=c.he*f;r.prov+=c.prov*f;r.enc+=c.enc*f;r.va+=c.va*f;r.total+=c.total*f;linhas.push({e,obra:ob,min:semHoras?0:min,valor:c.total*f,pct:f*100})})});
 const porObra=Object.values(res);return {porObra,linhas,total:porObra.reduce((s,o)=>s+o.total,0),semLanc,erros}}

 if(!tabs.find(t=>t[0]===S.ftab))S.ftab='dados';
 return `<button class="btn sm" data-act="go" data-r="colab">← Funcionários</button>
 <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:14px 0 16px"><div><h1>${esc(e.nome)}</h1><p class="sub" style="margin:0">Matrícula ${e.mat} · ${esc(e.funcao)} · última obra: ${esc(ultimaObra(e)||'—')} · admissão ${fD(e.admissao)}</p></div><div>${pill(e.status,e.status==='Ativo'?'ok':'warn')} ${d.obrPend?pill(d.obrPend+' documento(s) obrigatório(s) pendente(s)','bad'):pill('Documentação completa','ok')}</div></div>
 <div class="tabs">${tabs.map(t=>`<button class="btn sm ${S.ftab===t[0]?'primary':''}" data-act="ftab" data-t="${t[0]}">${t[1]}</button>`).join('')}</div>
 ${({dados:fichaDados,docs:fichaDocs,ponto:fichaPonto,hist:fichaHist})[S.ftab](e)}`}};
function fichaDados(e){if(!S.fd||S.fd.mat!==e.mat)S.fd={mat:e.mat,v:JSON.parse(JSON.stringify(e)),dirty:false};const v=S.fd.v;const ed=perm('colab','editar');
 const inp=(p,l,t)=>{let val=getF(v,p);if(t==='date')val=val?dk(new Date(val)):'';const a=`data-ff="${p}" ${ed?'':'disabled'}`;
  let c;if(Array.isArray(t))c=`<select ${a}>${t.map(o=>`<option value="${esc(o)}" ${String(val)===o?'selected':''}>${p==='adicional'?(o==='0'?'Nenhum':'Periculosidade 30%'):esc(o)}</option>`).join('')}</select>`;
  else if(t==='OBRAS')c=`<select ${a}>${optObras(val)}</select>`;else c=`<input ${a} type="${t==='date'?'date':t==='num'?'number':'text'}" value="${esc(val??'')}">`;
  return `<div><label>${l}</label>${c}</div>`};
 return FF.filter(g=>!g[2]||perm(g[2],'ver')).map(([g,fs,m])=>`<div class="card mt"><h3>${g}</h3><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0 14px">${fs.map(f=>inp(f[0],f[1],m&&!perm(m,'editar')?'ro':f[2])).join('')}</div></div>`).join('')+
 `<div class="toolbar mt"><span class="sp"></span><span class="small muted" id="fdirty"></span><button class="btn" data-act="fdescarta">Descartar alterações</button><button class="btn primary" data-act="fsalva" ${dis('editar','colab')}>Salvar cadastro</button></div>`}
function fichaDocs(e){const D=DOCS[e.mat];const d=docResumo(e.mat);const inc=perm('docs','incluir'),ed=perm('docs','editar'),ex=perm('docs','excluir');
 return `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>${d.ok} de ${d.tot} documentos recebidos</b><span class="small muted">PDF, JPG ou PNG, até 10 MB por arquivo. Itens marcados como "não se aplica" não contam.</span></div><div class="progress mt"><div style="width:${d.tot?d.ok/d.tot*100:0}%"></div></div></div>
 ${DOC_GRUPOS.map(g=>`<div class="card mt tablewrap"><h3>${g.g}</h3><table><thead><tr><th>Documento</th><th>Situação</th><th>Arquivo</th><th></th></tr></thead><tbody>${g.itens.map(([id,nome,obr])=>{const x=D[id];const a=x.arq;
  return `<tr><td>${esc(nome)} ${obr?'<span class="tag">obrigatório</span>':'<span class="tag">se aplicável</span>'}</td>
  <td><select data-docst="${id}" style="width:auto" ${ed?'':'disabled'}>${[['pendente','Pendente'],['recebido','Recebido'],['naoaplica','Não se aplica']].map(o=>`<option value="${o[0]}" ${x.st===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></td>
  <td class="small">${a?`<b>${esc(a.nome)}</b><br><span class="muted">${N(a.tam/1024)} KB · ${fD(a.em)} · ${esc(a.por)}</span>`:x.st==='pendente'?pill('Aguardando','warn'):'<span class="muted">—</span>'}</td>
  <td style="white-space:nowrap">${inc?`<label class="btn sm" style="margin:0;display:inline-flex;color:var(--text);font-size:13px">${a?'Substituir':'Anexar'}<input type="file" data-up="${id}" accept=".pdf,.jpg,.jpeg,.png" style="display:none"></label>`:''} ${a?`<button class="btn sm" data-act="docVer" data-id="${id}">Ver</button>`:''} ${a&&ex?`<button class="btn sm" data-act="docRm" data-id="${id}">Remover</button>`:''}</td></tr>`}).join('')}</tbody></table></div>`).join('')}
 <div class="toolbar mt"><span class="sp"></span>${perm('modelos','ver')||perm('docs','incluir')?`<button class="btn sm" data-act="fGerar">Gerar documento a partir de modelo</button>`:''}<button class="btn sm" data-act="docCsv" ${dis('exportar','docs')}>Exportar checklist (CSV)</button></div>`}
function fichaPonto(e){const k=CUR;const R=resumoPer(e,k);const R2=resumoPer(e,LAST);const lin=(t,R)=>`<tr><td>${t}</td><td class="num">${R.dias}</td><td class="num">${fm(R.trab)||'00:00'}</td><td class="num">${fm(R.he50)||'—'}</td><td class="num">${fm(R.he100)||'—'}</td><td class="num">${R.faltas}</td><td class="num">${fm(R.atraso)||'—'}</td><td>${Object.entries(R.horas).map(([o,m])=>pill(o+' · '+fmh(m),'info')).join(' ')}</td></tr>`;
 return `<div class="card tablewrap"><h3>Resumo do ponto</h3><table><thead><tr><th>Competência</th><th class="num">Dias trab.</th><th class="num">Horas trab.</th><th class="num">HE 50%</th><th class="num">HE 100%</th><th class="num">Faltas</th><th class="num">Atrasos</th><th>Horas por obra</th></tr></thead><tbody>${lin(compLabel(k)+' (em aberto, '+perLabel(k)+')',R)}${lin(compLabel(LAST)+' ('+perLabel(LAST)+')',R2)}</tbody></table>
 <div class="toolbar mt"><span class="sp"></span><button class="btn sm primary" data-act="abrirEspelho" data-mat="${e.mat}">Abrir espelho de ponto</button></div></div>`}
function fichaHist(e){const L=S.audit.filter(a=>a.det.includes('Mat. '+e.mat)||a.det.includes(e.nome));return `<div class="card tablewrap"><table><thead><tr><th>Data e hora</th><th>Usuário</th><th>Módulo</th><th>Ação</th><th>Detalhe</th></tr></thead><tbody>${L.map(a=>`<tr><td style="white-space:nowrap">${fDT(a.t)}</td><td>${esc(a.u)}</td><td>${esc(a.mod)}</td><td>${esc(a.acao)}</td><td class="small">${esc(a.det)}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">Sem registros.</td></tr>'}</tbody></table></div>`}
function salvaFicha(){const e=EMP.find(x=>x.mat===S.fd.mat);const v=S.fd.v;const ch=[];
 FF.forEach(([,fs,m])=>{if(m&&!perm(m,'editar'))return;fs.forEach(([p,l])=>{let a=getF(e,p),b=getF(v,p);if(p==='admissao'){a=fD(a);b=fD(b)}if(String(a??'')!==String(b??''))ch.push([p,l,a,b])})});
 if(!ch.length){toast('Nenhuma alteração para salvar');return}
 ch.forEach(([p,l,a,b])=>{let nv=getF(v,p);if(['salario','va'].includes(p))nv=+nv||0;if(p==='adicional')nv=+nv;if(p==='admissao')nv=new Date(nv);setF(e,p,nv);
  const sens=p.startsWith('banco.');log('Colaboradores','Editou cadastro','Mat. '+e.mat+' · '+l+': '+(sens?'(dado bancário alterado)':(a||'vazio')+' → '+(b||'vazio')))});
 S.fd=null;touch();toast(ch.length+' campo(s) atualizado(s) e registrado(s) na auditoria');render()}
function docUpload(input){const id=input.dataset.up;const f=input.files&&input.files[0];if(!f)return;
 if(f.size>10*1024*1024){toast('Arquivo maior que 10 MB');return}if(!/\.(pdf|jpe?g|png)$/i.test(f.name)){toast('Formato não aceito. Use PDF, JPG ou PNG.');return}
 const x=DOCS[S.fmat][id];const ant=x.arq?x.arq.nome:null;if(x.arq&&x.arq.url)URL.revokeObjectURL(x.arq.url);
 x.arq={nome:f.name,tam:f.size,em:new Date(),por:S.user.email,url:URL.createObjectURL(f),tipo:f.type};x.st='recebido';
 const nome=DOC_ITENS.find(i=>i[0]===id)[1];log('Documentos do colaborador',ant?'Substituiu documento':'Anexou documento','Mat. '+S.fmat+' · '+nome+' · '+f.name+(ant?' (anterior: '+ant+')':''));toast('Documento anexado');render()}

const DEF=d=>({e:'07:00',sa:'12:00',r:'13:00',s:d.getDay()===5?'16:00':'17:00'});
// ================= rateio =================
PAGES.rateio={html(){const k=S.comp;const R=rateioC(k);const fech=!!S.fechado[k];const aberta=k===CUR;const ed=perm('rateio','aprovar')&&!fech;
 const ob=R.porObra.filter(o=>o.total>0).sort((a,b)=>b.total-a.total);const cols=ob.map(o=>o.obra);
 const par=(f,l)=>`<label style="margin:0">${l}</label><input type="number" step="0.01" style="width:80px;min-width:0" value="${S.cfg[f]}" data-cfg="${f}" ${ed?'':'disabled'}>`;
 return `<h1>Rateio da folha por obra</h1><p class="sub">Calculado direto da folha de ponto: o custo de cada colaborador vai para as obras na proporção das horas trabalhadas em cada uma, como na aba RATEIO GERAL da planilha.</p>
 <div class="toolbar"><select data-sel="comp">${COMPS.map(c=>`<option value="${c}" ${c===k?'selected':''}>${compLabel(c)} · ${perLabel(c)}${S.fechado[c]?' · fechada':c===CUR?' · em aberto':''}</option>`).join('')}</select>
 ${par('ferias','Férias + 1/3 %')}${par('decimo','13º %')}${par('inss','INSS empresa %')}${par('fgts','FGTS %')}
 <span class="sp"></span>${fech?pill('Competência fechada','neutral'):aberta?pill('Parcial: período ainda em andamento','info'):`<button class="btn sm primary" data-act="fechar" ${dis('aprovar')}>Fechar competência</button>`}<button class="btn sm" data-act="expRateio" ${dis('exportar')}>Exportar no formato da planilha</button></div>
 ${R.semLanc||R.erros?`<div class="note">${R.semLanc?`<b>${R.semLanc}</b> dia(s) úteis sem lançamento de ponto neste período. `:''}${R.erros?`<b>${R.erros}</b> dia(s) com marcação incompleta. `:''}Revise antes de fechar: dias sem lançamento não entram nas horas.</div>`:''}
 <div class="card tablewrap"><h3>Resumo por obra · ${compLabel(k)}</h3><table><thead><tr><th>Obra</th><th class="num">Pessoas</th><th class="num">Horas</th><th class="num">Salários</th><th class="num">Horas extras</th><th class="num">Férias + 13º</th><th class="num">INSS + FGTS</th><th class="num">VA</th><th class="num">Total</th><th class="num">%</th></tr></thead><tbody>
 ${ob.map(o=>`<tr><td>${esc(o.obra)}</td><td class="num">${o.colabs.size}</td><td class="num">${N(o.horas/60)}</td><td class="num">${BRL(o.sal)}</td><td class="num">${BRL(o.he)}</td><td class="num">${BRL(o.prov)}</td><td class="num">${BRL(o.enc)}</td><td class="num">${BRL(o.va)}</td><td class="num"><b>${BRL(o.total)}</b></td><td class="num">${P(o.total/R.total*100)}</td></tr>`).join('')}</tbody>
 <tfoot><tr><td>Total</td><td></td><td class="num">${N(ob.reduce((s,o)=>s+o.horas,0)/60)}</td>${['sal','he','prov','enc','va','total'].map(f=>`<td class="num">${BRL(ob.reduce((s,o)=>s+o[f],0))}</td>`).join('')}<td class="num">100%</td></tr></tfoot></table></div>
 <div class="card mt"><h3>Composição do custo por obra</h3><div class="chartbox"><canvas id="chRat"></canvas></div></div>
 <div class="card mt"><div class="toolbar"><h3 style="margin:0">Horas por colaborador e obra</h3><span class="sp"></span><input data-f="rq" placeholder="Buscar colaborador" value="${esc(S.f.rq||'')}"><label class="check" style="margin:0"><input type="checkbox" data-f="rm" ${S.f.rm?'checked':''}> Só quem passou por mais de uma obra</label></div>
 <div class="tablewrap" id="ratT">${ratTable(cols)}</div><p class="small muted">Valor-hora = custo total do colaborador ÷ horas trabalhadas no período. Quem não trabalhou nenhuma hora (férias, afastamento) tem o custo lançado na obra atual.</p></div>`},
 after(){const R=rateioC(S.comp),pal=PAL();const ob=R.porObra.filter(o=>o.total>0).sort((a,b)=>b.total-a.total);
  chart('chRat',{type:'bar',data:{labels:ob.map(o=>o.obra),datasets:[['Salários','sal'],['Horas extras','he'],['Férias + 13º','prov'],['INSS + FGTS','enc'],['VA','va']].map(([l,f],i)=>({label:l,data:ob.map(o=>Math.round(o[f])),backgroundColor:pal[i]}))},options:{scales:{x:{stacked:true},y:{stacked:true,ticks:{callback:v=>N(v/1000)+' mil'}}},plugins:{tooltip:{callbacks:{label:c=>c.dataset.label+': '+BRL(c.raw)}}}}})}};
function ratRows(){const k=S.comp;const q=(S.f.rq||'').toLowerCase();return EMP.map(e=>({e,c:custoEmp(e,k)})).filter(x=>x.c&&(!q||(x.e.nome+x.e.mat).toLowerCase().includes(q))&&(!S.f.rm||Object.keys(x.c.R.horas).length>1))}
function ratTable(cols){if(!cols){const R=rateioC(S.comp);cols=R.porObra.filter(o=>o.total>0).sort((a,b)=>b.total-a.total).map(o=>o.obra)}const L=ratRows();
 return `<table><thead><tr><th>Colaborador</th><th class="num">Custo total</th><th class="num">Horas trab.</th><th class="num">Valor-hora</th>${cols.map(c=>`<th class="num" style="white-space:normal;min-width:80px">${esc(c)}</th>`).join('')}</tr></thead><tbody>
 ${L.map(({e,c})=>{const ht=Object.values(c.R.horas).reduce((s,v)=>s+v,0);return `<tr><td><a class="click" data-act="abrirEspelho" data-mat="${e.mat}" style="cursor:pointer;color:var(--accent)">${esc(e.nome)}</a><div class="small muted">${esc(e.funcao)}</div></td><td class="num">${BRL(c.total)}</td><td class="num">${N(ht/60,1)}</td><td class="num">${ht?BRL2(c.total/(ht/60)):'—'}</td>${cols.map(o=>`<td class="num">${c.R.horas[o]?N(c.R.horas[o]/60,1):''}</td>`).join('')}</tr>`}).join('')}</tbody></table><p class="small muted">${L.length} colaboradores</p>`}

// ================= vale-alimentação =================
PAGES.va={html(){const ym=S.vames;const meses=[0,1,2,3].map(i=>compKey(new Date(T0.getFullYear(),T0.getMonth()-i,1)));const ed=perm('va','editar');
 const L=EMP.map(e=>({e,v:vaMes(e,ym)})).filter(x=>x.v);const tot=L.reduce((s,x)=>s+x.v.receber,0);const[y,m]=ym.split('-').map(Number);const parcial=ym===compKey(T0);
 return `<h1>Vale-alimentação</h1><p class="sub">Mesma regra da planilha: valor proporcional aos dias do mês (até 30) e desconto por faltas registradas no ponto: 1 falta = 25%, 2 faltas = 50%, 3 ou mais = 100%.</p>
 <div class="toolbar"><select data-sel="vames">${meses.map(k=>`<option value="${k}" ${k===ym?'selected':''}>${MESESL[+k.split('-')[1]-1]} de ${k.split('-')[0]}</option>`).join('')}</select>${parcial?pill('Mês em andamento: faltas contadas até ontem','info'):''}<span class="sp"></span><b>Total a pagar: ${BRL2(tot)}</b><button class="btn sm" data-act="vaCsv" ${dis('exportar')}>Exportar CSV</button></div>
 <div class="note">Na planilha a coluna se chama "dias trabalhados". Aqui usei os dias de vínculo no mês (no máximo 30), de modo que quem trabalhou o mês todo recebe o valor cheio. Me confirme se é essa a regra.</div>
 <div class="card tablewrap"><table><thead><tr><th>Colaborador</th><th>Função</th><th class="num">Valor base</th><th class="num">Dias no mês</th><th class="num">Valor proporcional</th><th class="num">Faltas</th><th class="num">Desconto</th><th class="num">A receber</th></tr></thead><tbody>
 ${L.map(({e,v})=>`<tr><td>${esc(e.nome)}</td><td>${esc(e.funcao)}</td><td class="num">${ed?`<input type="number" data-va="${e.mat}" value="${e.va}" style="width:90px;text-align:right">`:BRL2(e.va)}</td><td class="num">${v.dias}</td><td class="num">${BRL2(v.prop)}</td><td class="num">${v.faltas?pill(v.faltas,'bad'):'0'}</td><td class="num">${v.desc?BRL2(v.desc)+' ('+(v.faltas>=3?'100':v.faltas*25)+'%)':'—'}</td><td class="num"><b>${BRL2(v.receber)}</b></td></tr>`).join('')}</tbody>
 <tfoot><tr><td colspan="4">Total</td><td class="num">${BRL2(L.reduce((s,x)=>s+x.v.prop,0))}</td><td class="num">${L.reduce((s,x)=>s+x.v.faltas,0)}</td><td class="num">${BRL2(L.reduce((s,x)=>s+x.v.desc,0))}</td><td class="num">${BRL2(tot)}</td></tr></tfoot></table></div>`}};
// ---------- movimentações
PAGES.movim={html(){const st=(arr,steps,t)=>arr.map((a,i)=>{const n=a.done.filter(Boolean).length;return `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><div><b>${esc(a.nome)}</b><div class="small muted">${esc(a.cargo)} · ${a.obra} · ${t==='adm'?'Início '+fD(a.inicio):'Desligamento '+fD(a.data)+' · '+esc(a.motivo)}</div></div>${pill(n+'/'+steps.length,n===steps.length?'ok':'warn')}</div>
 <div class="progress mt"><div style="width:${n/steps.length*100}%"></div></div><div class="mt">${steps.map((s,j)=>`<label class="check"><input type="checkbox" data-act="step" data-t="${t}" data-i="${i}" data-s="${j}" ${a.done[j]?'checked':''} ${dis()}><span class="${a.done[j]?'done':''}">${s}</span></label>`).join('')}</div></div>`}).join('');
 return `<h1>Admissões e desligamentos</h1><p class="sub">Checklists padronizados para nenhuma etapa legal ficar para trás.</p>
 <div class="card tablewrap"><h3>Vagas em aberto</h3><table><thead><tr><th>Cargo</th><th>Obra</th><th class="num">Qtd.</th><th>Abertura</th><th class="num">Dias em aberto</th><th>Etapa</th></tr></thead><tbody>${S.vagas.map(v=>{const d=dd(v.abertura,T0);return `<tr><td>${esc(v.cargo)}</td><td>${v.obra}</td><td class="num">${v.qtd}</td><td>${fD(v.abertura)}</td><td class="num">${pill(d+'d',d>30?'bad':d>15?'warn':'ok')}</td><td>${esc(v.etapa)}</td></tr>`}).join('')}</tbody></table></div>
 <h3 class="mt">Admissões em andamento</h3><div class="grid charts" style="margin-top:0">${st(S.adms,ADM_STEPS,'adm')}</div>
 <h3 class="mt">Desligamentos em andamento</h3><div class="grid charts" style="margin-top:0">${st(S.desls,DESL_STEPS,'desl')}</div>`}};

// ---------- férias

 const stt=e=>{if(e.feriasProg)return pill('Programada · '+fD(e.feriasProg),'info');const d=dd(T0,e.feriasLimite);if(d<0)return pill('Vencida','bad');if(d<=60)return pill('Crítica · '+d+'d','bad');if(d<=120)return pill('Programar · '+d+'d','warn');return pill('Em dia','ok')};

 <div class="card tablewrap"><table><thead><tr><th>Colaborador</th><th>Função</th><th>Obra</th><th>Admissão</th><th>Limite para conceder</th><th>Situação</th><th></th></tr></thead><tbody>
 ${L.map(e=>`<tr><td>${esc(e.nome)}</td><td>${esc(e.funcao)}</td><td>${e.obra}</td><td>${fD(e.admissao)}</td><td>${fD(e.feriasLimite)}</td><td>${stt(e)}</td><td><button class="btn sm" data-act="progFerias" data-mat="${e.mat}" ${dis()}>${e.feriasProg?'Reprogramar':'Programar'}</button></td></tr>`).join('')}</tbody></table></div>`}};

PAGES.sst={html(){const k=K();const nrL=k.nrs.filter(x=>dd(T0,x.d)<=60).sort((a,b)=>a.d-b.d);const asoL=k.at.filter(e=>dd(T0,e.aso)<=60).sort((a,b)=>a.aso-b.aso);

function userModal(i){const u=i==null?{nome:'',email:'',perfil:'Encarregado de obra',obras:[],ativo:true}:USERS[i];const todas=u.obras==='*';
 openModal(`<h2>${i==null?'Novo usuário':'Editar usuário'}</h2><div class="row"><div><label>Nome</label><input id="uNome" value="${esc(u.nome)}"></div><div><label>E-mail (login)</label><input id="uEmail" type="email" value="${esc(u.email)}" ${i==null?'':'disabled'}></div></div>

 <label>Obras liberadas</label><label class="check"><input type="checkbox" id="uTodas" ${todas?'checked':''}> Todas as obras</label>

 <div id="uErr" class="err"></div><div class="modal-actions"><button class="btn" data-act="close">Cancelar</button><button class="btn primary" data-act="uSalvar" data-i="${i==null?'':i}">Salvar</button></div>`)}
function userSalvar(i){const nome=$('#uNome').value.trim(),email=$('#uEmail').value.trim().toLowerCase(),perfil=$('#uPerf').value;
 const obras=$('#uTodas').checked?'*':[...document.querySelectorAll('[data-uob]')].filter(x=>x.checked).map(x=>x.dataset.uob);
 if(!nome||!email||!email.includes('@')){$('#uErr').textContent='Informe nome e e-mail válido.';return}
 if(obras!=='*'&&!obras.length){$('#uErr').textContent='Libere ao menos uma obra.';return}
 if(i===''){if(USERS.find(u=>u.email===email)){$('#uErr').textContent='Já existe um usuário com este e-mail.';return}
  USERS.push({nome,email,perfil,obras,ativo:true,senha:$('#uPw').value});log('Usuários e perfis','Criou usuário',email+' · perfil '+perfil+' · obras: '+(obras==='*'?'todas':obras.join(', ')));toast('Usuário criado. Ele já pode entrar com a senha provisória.')}
 else{const u=USERS[+i];const ch=[];if(u.nome!==nome)ch.push('nome: '+u.nome+' → '+nome);if(u.perfil!==perfil)ch.push('perfil: '+u.perfil+' → '+perfil);const ao=u.obras==='*'?'todas':u.obras.join(', '),no=obras==='*'?'todas':obras.join(', ');if(ao!==no)ch.push('obras: '+ao+' → '+no);
  Object.assign(u,{nome,perfil,obras});if(ch.length)log('Usuários e perfis','Alterou usuário',u.email+' · '+ch.join(' · '));toast(ch.length?'Usuário atualizado':'Nada alterado')}
 render()}

document.addEventListener('click',ev=>{const t=ev.target.closest('[data-act]');if(!t||t.disabled)return;const f=ACT[t.dataset.act];if(f){if(t.tagName!=='INPUT'&&t.tagName!=='A')ev.preventDefault();f(t,ev)}});
const REFRESH={cq:()=>$('#colabT').innerHTML=colabTable(),co:'cq',cs:'cq',cd:'cq',rq:()=>$('#ratT').innerHTML=ratTable(),rm:'rq',aq:()=>$('#audT').innerHTML=audTable(),au:'aq',am:'aq'};
function onField(ev){if(EXTRA_FIELD(ev))return;const t=ev.target;const ch=ev.type==='change';
 if(t.dataset.f){S.f[t.dataset.f]=t.type==='checkbox'?t.checked:t.value;let r=REFRESH[t.dataset.f];if(typeof r==='string')r=REFRESH[r];r&&r();return}
 if(t.dataset.pm&&S.pd){const r=S.pd.rows[t.dataset.pm];const f=t.dataset.pf;let v=t.value;if(f==='h2')v=v===''?0:Math.round(+v*60);r[f]=v;S.pd.dirty=true;
  if(f==='oc'||f==='obra2'){if(ch){if(f==='oc'&&v==='N'&&!r.e&&carga(pdk(S.pdate))>0)Object.assign(r,DEF(pdk(S.pdate)));if(f==='obra2'&&!v)r.h2=0;rerenderRows()}return}
  const c=$('#pc-'+t.dataset.pm);if(c)c.innerHTML=calcCell(rowCalc(t.dataset.pm),pdk(S.pdate));return}
 if(t.dataset.ff&&S.fd){setF(S.fd.v,t.dataset.ff,t.value);S.fd.dirty=true;const x=$('#fdirty');if(x)x.textContent='Alterações não salvas';return}
 if(!ch)return;
 if(t.dataset.docst){const x=DOCS[S.fmat][t.dataset.docst];const a=x.st;x.st=t.value;log('Documentos do colaborador','Alterou situação','Mat. '+S.fmat+' · '+DOC_ITENS.find(i=>i[0]===t.dataset.docst)[1]+': '+a+' → '+t.value);render();return}
 if(t.dataset.up){docUpload(t);return}
 if(t.dataset.cfg){const a=S.cfg[t.dataset.cfg];S.cfg[t.dataset.cfg]=+t.value||0;log('Rateio da folha','Alterou parâmetro',t.dataset.cfg+': '+a+' → '+S.cfg[t.dataset.cfg]);render();return}
 if(t.dataset.va){const e=EMP.find(x=>x.mat===t.dataset.va);const a=e.va;e.va=+t.value||0;log('Vale-alimentação','Alterou valor base','Mat. '+e.mat+': '+a+' → '+e.va);render();return}
 if(t.dataset.perm){const[m,a]=t.dataset.perm.split('|');const pf=PROFILES[S.perfSel].p[m];const antes=pf[a];pf[a]=t.checked;if(a==='ver'&&!t.checked)ACOES.forEach(x=>pf[x[0]]=false);if(a!=='ver'&&t.checked)pf.ver=true;
  log('Usuários e perfis','Alterou permissão','Perfil '+S.perfSel+' · '+MODS.find(x=>x[0]===m)[1]+' · '+ACOES.find(x=>x[0]===a)[1]+': '+(antes?'sim':'não')+' → '+(t.checked?'sim':'não'));render();return}
 if(t.dataset.uob||t.id==='uTodas'){if(t.id==='uTodas')document.querySelectorAll('[data-uob]').forEach(x=>x.checked=t.checked);else if(!t.checked)$('#uTodas').checked=false;return}
 if(t.dataset.sel){const s=t.dataset.sel,v=t.value;
  if(s==='pdate'){if(!v||v>dk(T0))return;S.pdate=v;S.pd=null}
  else if(s==='pobra'){S.pobra=v;S.pd=null}
  else if(s==='addcolab'){if(!v)return;ensureDraft();const e=EMP.find(x=>x.mat===v);const d=pdk(S.pdate);const old=getP(d,v);S.pd.rows[v]=old?Object.assign(JSON.parse(JSON.stringify(old)),{obra:S.pobra}):Object.assign({oc:'N',obs:'',obra:S.pobra},carga(d)?DEF(d):{e:'',sa:'',r:'',s:''});S.pd.extra.push(v);S.pd.dirty=true;toast(e.nome+' incluído nesta obra. Salve para registrar.')}
  else if(s==='emat')S.emat=v;else if(s==='ecomp')S.ecomp=v;else if(s==='comp'){S.comp=v;log('Rateio da folha','Consultou competência',compLabel(v))}else if(s==='vames')S.vames=v;
  render()}}

function stepper(r){let cur=['reprovada','cancelada','devolvida'].includes(r.etapa)?null:r.etapa;const last=r.hist.length?r.hist[r.hist.length-1]:null;
 return `<div class="stepper">${ETAPAS.map(([id,t],i)=>{let cls='pend',sub='';
  const skip=(id==='gestor'&&!S.fluxo.gestor.ativo)||(id==='diretoria'&&!dirNecessaria(r));
  const done=id==='solic'||(cur&&ETAPA_IDX(cur)>i)||r.etapa==='concluida'||r.hist.some(h=>h.acao.startsWith('Aprovou')&&((id==='gestor'&&h.acao.includes('gestor'))||(id==='diretoria'&&h.acao.includes('diretoria'))))||(id==='docs'&&r.hist.some(h=>h.acao==='Concluiu documentação'));
  if(skip){cls='skip';sub='não exigida'}else if(done)cls='sok';else if(cur===id)cls='cur';
  if((r.etapa==='reprovada'||r.etapa==='devolvida')&&last&&!done&&!skip&&((last.acao.includes('gestor')&&id==='gestor')||(last.acao.includes('diretoria')&&id==='diretoria'))){cls='bad';sub=r.etapa==='reprovada'?'reprovada':'devolvida'}
  const h=r.hist.slice().reverse().find(x=>(id==='solic'&&x.acao==='Criou a solicitação')||(id==='gestor'&&/gestor/.test(x.acao))||(id==='diretoria'&&/diretoria/.test(x.acao))||(id==='docs'&&x.acao==='Concluiu documentação')||(id==='concluida'&&x.acao==='Efetivou admissão'));
  if(h&&!sub)sub=fD(h.t);
  return `<div class="st ${cls}"><div class="dot">${cls==='sok'?'✓':cls==='bad'?'✕':i+1}</div><div class="st-t">${t}</div><div class="st-s">${sub}</div></div>`}).join('')}</div>`}

## Cláusula 1ª – Função
O(A) EMPREGADO(A) é admitido(a) para exercer a função de **{{cargo}}**, obrigando-se a executar as atividades inerentes à função e outras compatíveis com sua condição pessoal, conforme orientação da EMPREGADORA.

## Cláusula 2ª – Local de trabalho
O trabalho será prestado nas obras e canteiros da EMPREGADORA, inicialmente na obra **{{obra}}**. Considerando a natureza da atividade de construção, o(a) EMPREGADO(A) concorda com a prestação de serviços em outras obras, inclusive em outras localidades, quando necessário, nos termos do art. 469 da CLT.

## Cláusula 3ª – Remuneração
O(A) EMPREGADO(A) receberá salário mensal de **R$ {{salario}}** ({{salario_extenso}}), {{adicional}}, pago até o 5º (quinto) dia útil do mês subsequente ao vencido.

## Cláusula 4ª – Jornada de trabalho
A jornada de trabalho será de {{jornada}}. As horas extraordinárias e a compensação de jornada observarão a legislação, o acordo de compensação/banco de horas e a convenção coletiva aplicável.

## Cláusula 5ª – Prazo de experiência
Este contrato vigorará por 45 (quarenta e cinco) dias, de {{data_admissao}} a {{fim_exp1}}, podendo ser prorrogado uma única vez por igual período, até {{fim_exp2}}, sem que a soma ultrapasse 90 (noventa) dias. Continuando o(a) EMPREGADO(A) a trabalhar após o término do prazo, o contrato passará a vigorar por prazo indeterminado.

## Cláusula 6ª – Descontos
O(A) EMPREGADO(A) autoriza os descontos previstos em lei e em convenção coletiva e, em caso de dano causado por dolo, ou por culpa mediante acordo, o desconto do respectivo valor, nos termos do art. 462, § 1º, da CLT.

## Cláusula 7ª – Saúde e segurança do trabalho
O(A) EMPREGADO(A) obriga-se a cumprir as normas de segurança e saúde do trabalho, a participar dos treinamentos exigidos e a usar corretamente os equipamentos de proteção individual fornecidos. A recusa injustificada constitui ato faltoso, nos termos do art. 158 da CLT.

## Cláusula 8ª – Regulamento interno e dados pessoais
O(A) EMPREGADO(A) declara conhecer o regulamento interno da EMPREGADORA e está ciente de que seus dados pessoais serão tratados para a execução deste contrato e o cumprimento de obrigações legais, conforme a Lei nº 13.709/2018 (LGPD).

function brutoEmp(e,k){const p=periodo(k);if(e.admissao>p.fim)return null;const R=resumoPer(e,k);const vh=e.salario*(1+e.adicional)/220;
 const de=e.admissao>p.ini?e.admissao:p.ini;const ate=p.fim<T0?p.fim:addD(T0,-1);const totDias=dd(p.ini,p.fim)+1;const fr=Math.max(0,Math.min(1,(dd(de,ate)+1)/totDias));
 const base=e.salario*(1+e.adicional)*fr;const he=R.he50/60*vh*1.5+R.he100/60*vh*2;const desc=(R.falta+R.atraso)/60*vh;const v=vaMes(e,k);
 return {R,vh,fr,base,he,desc,bruto:Math.max(0,base+he-desc),va:v?v.receber*fr:0}}
function coefs(k){const re=S.encReal[k]||{};const key='cf'+k+JSON.stringify(S.cfg)+JSON.stringify(re)+S.rev;if(_rc[key])return _rc[key];let tb=0;EMP.forEach(e=>{const b=brutoEmp(e,k);if(b)tb+=b.bruto});
 const c={tb,fonte:{}};ENC.forEach(([x])=>{const v=re[x];if(v!==''&&v!=null&&!isNaN(+v)&&tb){c[x]=+v/tb;c.fonte[x]='real'}else{c[x]=S.cfg[x]/100;c.fonte[x]='estimado'}});_rc[key]=c;return c}
function custoEmp(e,k){const b=brutoEmp(e,k);if(!b)return null;const c=coefs(k);const o=Object.assign({},b);ENC.forEach(([x])=>o[x]=b.bruto*c[x]);o.prov=o.ferias+o.decimo;o.enc=o.inss+o.fgts;o.total=b.bruto+o.prov+o.enc+b.va;return o}
function rateio(k){const res={};OBRAS.forEach(o=>res[o.id]={obra:o.id,colabs:new Set(),horas:0,sal:0,he:0,ferias:0,decimo:0,inss:0,fgts:0,prov:0,enc:0,va:0,total:0});const linhas=[];let semLanc=0,erros=0;
 EMP.forEach(e=>{const c=custoEmp(e,k);if(!c)return;semLanc+=c.R.semLanc;erros+=c.R.erros;let hs=Object.entries(c.R.horas);const ht=hs.reduce((s,h)=>s+h[1],0);const sh=!ht;if(sh)hs=[[e.obra,1]];const tot=ht||1;
  hs.forEach(([ob,min])=>{const f=min/tot;const r=res[ob];if(!r)return;r.colabs.add(e.mat);r.horas+=sh?0:min;r.sal+=(c.base-c.desc)*f;r.he+=c.he*f;['ferias','decimo','inss','fgts','va','prov','enc','total'].forEach(x=>r[x]+=c[x]*f);linhas.push({e,obra:ob,min:sh?0:min,valor:c.total*f,pct:f*100,c})})});
 const porObra=Object.values(res);return {porObra,linhas,total:porObra.reduce((s,o)=>s+o.total,0),semLanc,erros,coef:coefs(k)}}
