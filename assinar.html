<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espelho de ponto · Avante Engenharia</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="logo-marca.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<style>
:root{--azul:#1771b6;--azul2:#0f5a93;--txt:#1d2733;--mut:#5f6b78;--lin:#dde3ea;--bg:#eef1f5;--ok:#1f8a4c;--bad:#c0392b}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{background:#fff;border-bottom:1px solid var(--lin);padding:12px 16px;display:flex;align-items:center;gap:12px}header img{height:30px}header span{font-size:13px;color:var(--mut)}
main{max-width:860px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--lin);border-radius:12px;padding:18px;margin-bottom:14px}
h1{font-size:20px;margin:0 0 6px}p{margin:6px 0}.mut{color:var(--mut);font-size:14px}
label{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
input,textarea{width:100%;font:inherit;font-size:18px;padding:12px;border:1px solid #c7d0da;border-radius:10px;background:#fff;color:var(--txt)}
textarea{min-height:120px;font-size:16px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:14px 18px;width:100%;cursor:pointer;margin-top:10px}
.pri{background:var(--azul);color:#fff}.pri:active{background:var(--azul2)}.sec{background:#fff;color:var(--txt);border:1px solid #c7d0da}.lnk{background:none;color:var(--azul);padding:8px;width:auto}
button:disabled{opacity:.5}
.err{color:var(--bad);font-size:14px;margin-top:10px;min-height:18px}
.esp{overflow:hidden;border:1px solid var(--lin);border-radius:8px;background:#fff}
#pad{width:100%;height:200px;border:2px dashed #9fb3c8;border-radius:10px;background:#fff;touch-action:none;display:block}
.ok{background:#e8f6ee;border-color:#bfe3cd}.ok h1{color:var(--ok)}
.cod{font-family:ui-monospace,Menlo,monospace;font-size:15px;letter-spacing:.5px}
.row{display:flex;gap:10px}.row>*{flex:1}
.hide{display:none}
</style>
</head>
<body>
<header><img src="logo.png" alt="Avante Engenharia"><span>Espelho de ponto</span></header>
<main id="m"><div class="card"><p class="mut">Carregando…</p></div></main>
<script>
(function(){
var cfg=window.PORTAL_CONFIG||{};var sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY,{auth:{persistSession:false}});
var tk=new URLSearchParams(location.search).get('t')||'';var m=document.getElementById('m');var ID={},D=null;
function e(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function dt(x){return x?new Date(x).toLocaleString('pt-BR'):''}
function cod(h){return String(h||'').slice(0,16).toUpperCase().replace(/(.{4})(?=.)/g,'$1-')}
function comp(k){var M=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];var p=k.split('-');return M[+p[1]-1]+' de '+p[0]}
async function rpc(n,a){var r=await sb.rpc(n,a);if(r.error)return {erro:'Não foi possível conectar. Verifique a internet e tente de novo.'};return r.data||{}}
if(!tk){m.innerHTML='<div class="card"><h1>Link incompleto</h1><p class="mut">Abra o link exatamente como recebeu no WhatsApp.</p></div>';return}
function tela1(msg){m.innerHTML='<div class="card"><h1>Confirme seus dados</h1><p class="mut">Para ver o seu espelho de ponto, informe:</p>'+
 '<label for="c4">4 primeiros dígitos do CPF</label><input id="c4" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="0000">'+
 '<label for="dn">Data de nascimento</label><input id="dn" type="date">'+
 '<div class="err" id="er">'+e(msg||'')+'</div><button class="pri" id="b1">Abrir meu espelho</button></div>';
 document.getElementById('b1').onclick=async function(){var c4=document.getElementById('c4').value.replace(/\D/g,''),dn=document.getElementById('dn').value;if(c4.length!==4||!dn){document.getElementById('er').textContent='Preencha os 4 dígitos e a data de nascimento.';return}
  this.disabled=true;var r=await rpc('espelho_abrir',{p_token:tk,p_cpf4:c4,p_nasc:dn});this.disabled=false;if(r.erro){document.getElementById('er').textContent=r.erro;return}ID={c4:c4,dn:dn};D=r;tela2()}}
function espHTML(){return '<div class="esp"><div id="z">'+D.html+'</div></div>'}
function ajusta(){var z=document.getElementById('z');if(!z)return;var w=z.parentNode.clientWidth;var s=Math.min(1,w/800);z.style.zoom=s}
function tela2(){var nome=String(D.nome||'').split(' ')[0];
 if(D.status==='Assinado'){m.innerHTML='<div class="card ok"><h1>Espelho já assinado</h1><p>Assinado em '+e(dt(D.assinado_em))+'.</p><p class="mut">Código de verificação: <span class="cod">'+e(cod(D.hash))+'</span></p></div>'+espHTML();ajusta();return}
 m.innerHTML='<div class="card"><h1>Olá, '+e(nome.charAt(0)+nome.slice(1).toLowerCase())+'</h1><p>Confira o seu espelho de ponto de <b>'+e(comp(D.competencia))+'</b>: dias, marcações, horas extras, atrasos e faltas.</p>'+
 '<p class="mut">Para ver melhor, amplie com dois dedos.</p>'+(D.status==='Contestado'?'<p class="mut">Você contestou este espelho. O RH vai corrigir e enviar um novo link.</p>':'')+'</div>'+espHTML()+
 '<div class="card"><div class="row"><button class="sec" id="bc">Contestar</button><button class="pri" id="bo">Concordo</button></div></div>';ajusta();
 document.getElementById('bo').onclick=tela3;document.getElementById('bc').onclick=telaC}
function tela3(){m.innerHTML='<div class="card"><h1>Assine com o dedo</h1><p class="mut">Ao assinar, declaro que conferi o espelho de ponto de '+e(comp(D.competencia))+' e que as marcações estão corretas.</p>'+
 '<canvas id="pad"></canvas><div style="display:flex;justify-content:space-between;align-items:center"><span class="mut" style="font-size:13px">Assine dentro do quadro</span><button class="lnk" id="bl">Limpar</button></div>'+
 '<div class="err" id="er"></div><button class="pri" id="ba">Assinar espelho</button><button class="sec" id="bv">Voltar</button></div>';
 var c=document.getElementById('pad');var r=c.getBoundingClientRect();var k=window.devicePixelRatio||1;c.width=r.width*k;c.height=r.height*k;var x=c.getContext('2d');x.scale(k,k);x.lineWidth=2.4;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#0b2a4a';
 var des=false,pts=0,last=null;function pos(ev){var b=c.getBoundingClientRect();return [ev.clientX-b.left,ev.clientY-b.top]}
 c.addEventListener('pointerdown',function(ev){des=true;last=pos(ev);c.setPointerCapture(ev.pointerId);ev.preventDefault()});
 c.addEventListener('pointermove',function(ev){if(!des)return;var p=pos(ev);x.beginPath();x.moveTo(last[0],last[1]);x.lineTo(p[0],p[1]);x.stroke();last=p;pts++;ev.preventDefault()});
 ['pointerup','pointercancel','pointerleave'].forEach(function(t){c.addEventListener(t,function(){des=false})});
 document.getElementById('bl').onclick=function(){x.clearRect(0,0,c.width,c.height);pts=0};document.getElementById('bv').onclick=tela2;
 document.getElementById('ba').onclick=async function(){if(pts<15){document.getElementById('er').textContent='Desenhe sua assinatura no quadro.';return}
  var o=document.createElement('canvas');o.width=600;o.height=Math.round(600*c.height/c.width);o.getContext('2d').drawImage(c,0,0,o.width,o.height);
  this.disabled=true;var res=await rpc('espelho_assinar',{p_token:tk,p_cpf4:ID.c4,p_nasc:ID.dn,p_png:o.toDataURL('image/png'),p_ua:navigator.userAgent});this.disabled=false;
  if(res.erro){document.getElementById('er').textContent=res.erro;return}
  m.innerHTML='<div class="card ok"><h1>Espelho assinado</h1><p>Obrigado! Sua assinatura foi registrada em '+e(dt(res.assinado_em))+'.</p><p class="mut">Código de verificação: <span class="cod">'+e(cod(res.hash))+'</span></p><p class="mut">Se precisar de uma cópia, peça ao RH.</p></div>'}}
function telaC(){m.innerHTML='<div class="card"><h1>Contestar o espelho</h1><p class="mut">Explique o que está errado (dia, horário, falta, hora extra). O RH vai conferir e enviar um novo link.</p>'+
 '<label for="mo">O que está errado?</label><textarea id="mo" maxlength="2000" placeholder="Ex.: dia 05/10 eu trabalhei até 18h, não até 17h."></textarea><div class="err" id="er"></div>'+
 '<button class="pri" id="be">Enviar contestação</button><button class="sec" id="bv">Voltar</button></div>';
 document.getElementById('bv').onclick=tela2;document.getElementById('be').onclick=async function(){var mo=document.getElementById('mo').value.trim();if(mo.length<5){document.getElementById('er').textContent='Descreva o que está errado.';return}
  this.disabled=true;var r=await rpc('espelho_contestar',{p_token:tk,p_cpf4:ID.c4,p_nasc:ID.dn,p_motivo:mo,p_ua:navigator.userAgent});this.disabled=false;if(r.erro){document.getElementById('er').textContent=r.erro;return}
  m.innerHTML='<div class="card"><h1>Contestação enviada</h1><p>O RH recebeu sua mensagem e vai corrigir o espelho. Você receberá um novo link para assinar.</p></div>'}}
window.addEventListener('resize',ajusta);tela1();
})();
</script>
</body>
</html>
